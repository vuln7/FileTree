# Builds and tests FileTree from this source on every change.
# Pushing a version tag such as v0.1.0 also publishes the exe as a release, with a checksum
# and a signed record tying the exe to the commit it was built from.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['README.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      # Builds the C runtime into the exe, so it runs without any redistributable installed.
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use the latest stable Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustc --version

      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked

      - name: Name the exe and record its checksum
        run: |
          Copy-Item target\release\filetree.exe FileTree.exe
          $hash = (Get-FileHash FileTree.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  FileTree.exe" | Out-File -Encoding ascii -NoNewline FileTree.exe.sha256
          Get-Content FileTree.exe.sha256

      - name: Sign a record of how this exe was built
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: FileTree.exe

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: FileTree
          path: |
            FileTree.exe
            FileTree.exe.sha256
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: FileTree

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          cat > notes.md <<EOF
          Download **FileTree.exe** below and double-click it. Nothing to install. Needs 64-bit Windows 10 or 11.

          This exe was built from this release's source by [this public GitHub Actions run]($GITHUB_SERVER_URL/$REPOSITORY/actions/runs/$GITHUB_RUN_ID).

          **SHA-256:** \`$(cut -d' ' -f1 FileTree.exe.sha256)\`
          EOF
          gh release create "$TAG" FileTree.exe FileTree.exe.sha256 \
            --repo "$REPOSITORY" --title "FileTree $TAG" --notes-file notes.md
